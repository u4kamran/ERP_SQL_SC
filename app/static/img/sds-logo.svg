<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Shafique Departmental Store">
  <defs>
    <linearGradient id="sds-g" x1="18" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9a2a"/>
      <stop offset="55%" stop-color="#008000"/>
      <stop offset="100%" stop-color="#045a1c"/>
    </linearGradient>
    <filter id="sds-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#003d12" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Badge -->
  <circle cx="64" cy="64" r="58" fill="url(#sds-g)" filter="url(#sds-soft)"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <!-- Store awning -->
  <path d="M34 46h60v8c0 1.1-.9 2-2 2H36c-1.1 0-2-.9-2-2v-8z" fill="#ffffff" opacity="0.95"/>
  <path d="M34 46c0-3 2.5-5.5 5.5-5.5h49c3 0 5.5 2.5 5.5 5.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 46v-3.5M50 46v-3.5M60 46v-3.5M70 46v-3.5M80 46v-3.5M90 46v-3.5" stroke="#0a7a22" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Storefront body -->
  <rect x="40" y="56" width="48" height="34" rx="3" fill="#ffffff" opacity="0.96"/>
  <rect x="46" y="61" width="14" height="14" rx="1.5" fill="#0a7a22" opacity="0.85"/>
  <rect x="68" y="61" width="14" height="14" rx="1.5" fill="#0a7a22" opacity="0.85"/>
  <rect x="58" y="78" width="12" height="12" rx="1.2" fill="#0a7a22" opacity="0.9"/>
  <!-- Monogram -->
  <text x="64" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">SDS</text>
