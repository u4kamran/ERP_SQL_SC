<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - {{ app_name }}</title>
    <link rel="icon" href="{{ brand_icon_url }}">
    {% include "partials/brand_head.html" %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="ahs-error-body">
    <div class="text-center p-4" style="max-width:420px">
        <img src="{{ brand_logo_url }}" alt="{{ app_name }}" style="width:min(240px,80vw);height:auto;margin-bottom:1.25rem">
        <h1 class="h3">{{ code }}</h1>
        <p class="text-muted">{{ message }}</p>
        <a class="btn btn-primary" href="/dashboard">Return home</a>
        <p class="small text-muted mt-3 mb-0">{{ brand_slogan }}</p>
    </div>
</body>
</html>
