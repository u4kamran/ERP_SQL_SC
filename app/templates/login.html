<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Login - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/login.css" rel="stylesheet">
</head>
<body class="login-body">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card login-card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">
                        <!-- Company Logo Area -->
                        <div class="text-center mb-4">
                            <div class="logo-placeholder mx-auto mb-3">
                                <i class="bi bi-building-gear fs-1 text-primary"></i>
                            </div>
                            <h4 class="fw-bold text-primary mb-1">{{ app_name }}</h4>
                            <p class="text-muted small">Enterprise Authentication System</p>
                        </div>

                        <!-- Alert Messages -->
                        <div id="alert-container" class="d-none">
                            <div id="alert-box" class="alert" role="alert"></div>
                        </div>

                        <!-- Login Form -->
                        <form id="login-form" novalidate>
                            <input type="hidden" id="csrf-token" value="{{ csrf_token }}">

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username"
                                           placeholder="Enter username" required autocomplete="username" autofocus>
                                </div>
                                <div class="invalid-feedback">Username is required.</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="Enter password" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback">Password is required.</div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember_me">
                                    <label class="form-check-label" for="remember-me">Remember Me</label>
                                </div>
                                <a href="#" id="forgot-password-link" class="text-decoration-none small">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
                                <span id="login-btn-text">Sign In</span>
                                <span id="login-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted small py-3 bg-transparent border-0">
                        &copy; 2026 {{ app_name }}. All rights reserved.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
