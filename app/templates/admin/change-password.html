{% extends "base.html" %}
{% block title %}Change Password - {{ app_name }}{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-stat">
            <div class="card-body p-4">
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="form-label">Current Password *</label>
                        <input type="password" class="form-control" id="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password *</label>
                        <input type="password" class="form-control" id="new-password" required minlength="8">
                        <small class="text-muted">Min 8 chars with uppercase, lowercase, digit, and special character.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password *</label>
                        <input type="password" class="form-control" id="confirm-password" required minlength="8">
                    </div>
                    <div id="form-error" class="alert alert-danger d-none"></div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-key me-1"></i> Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await Auth.requireAuth();

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('form-error');
        errEl.classList.add('d-none');

        const newPwd = document.getElementById('new-password').value;
        const confirmPwd = document.getElementById('confirm-password').value;

        if (newPwd !== confirmPwd) {
            errEl.textContent = 'New passwords do not match.';
            errEl.classList.remove('d-none');
            return;
        }

        try {
            await Api.post('/api/v1/auth/change-password', {
                current_password: document.getElementById('current-password').value,
                new_password: newPwd,
            });
            Auth.showAlert('alert-container', 'Password changed successfully!', 'success');
            document.getElementById('changePasswordForm').reset();
            setTimeout(() => window.location.href = '/dashboard', 2000);
        } catch (err) {
            errEl.textContent = err.message;
            errEl.classList.remove('d-none');
        }
    });
});
</script>
{% endblock %}
