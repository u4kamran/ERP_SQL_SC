{% extends "base.html" %}
{% block title %}Audit Logs - {{ app_name }}{% endblock %}
{% block page_title %}Audit Logs{% endblock %}

{% block content %}
<div class="card card-stat">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>IP</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="audit-table-body">
                    <tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await Auth.requireAuth();
    if (!Auth.hasPermission('auth.audit.view')) {
        Auth.showAlert('alert-container', 'You do not have permission to view audit logs.', 'warning');
        return;
    }
    try {
        const logs = await Api.get('/api/v1/audit/?limit=100');
        const tbody = document.getElementById('audit-table-body');
        if (!logs.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No audit logs.</td></tr>';
            return;
        }
        tbody.innerHTML = logs.map(l => `
            <tr>
                <td class="small text-nowrap">${formatUtcDateTime(l.created_date)}</td>
                <td>${l.username || '—'}</td>
                <td><code>${l.action}</code></td>
                <td class="small">${l.entity_type ? `${l.entity_type} #${l.entity_id || ''}` : '—'}</td>
                <td class="small">${l.ip_address || '—'}</td>
                <td><span class="badge bg-${l.status === 'SUCCESS' ? 'success' : 'danger'}">${l.status}</span></td>
            </tr>
        `).join('');
    } catch (err) {
        Auth.showAlert('alert-container', err.message, 'danger');
    }
});
</script>
{% endblock %}
