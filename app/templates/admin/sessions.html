{% extends "base.html" %}
{% block title %}Sessions - {{ app_name }}{% endblock %}
{% block page_title %}Active Sessions{% endblock %}

{% block content %}
<div class="card card-stat">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Browser</th>
                        <th>Device</th>
                        <th>OS</th>
                        <th>IP Address</th>
                        <th>Last Activity</th>
                        <th>Remember Me</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="sessions-table-body">
                    <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await Auth.requireAuth();
    if (!Auth.hasPermission('auth.sessions.view')) {
        Auth.showAlert('alert-container', 'You do not have permission to view sessions.', 'warning');
        return;
    }
    await loadSessions();
});

async function loadSessions() {
    const tbody = document.getElementById('sessions-table-body');
    try {
        const sessions = await Api.get('/api/v1/sessions/');
        if (!sessions.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No active sessions.</td></tr>';
            return;
        }
        tbody.innerHTML = sessions.map(s => `
            <tr>
                <td>${s.browser || '—'}</td>
                <td>${s.device || '—'}</td>
                <td>${s.operating_system || '—'}</td>
                <td>${s.ip_address || '—'}</td>
                <td class="small">${formatUtcDateTime(s.last_activity_date)}</td>
                <td>${s.is_remember_me ? 'Yes' : 'No'} ${s.is_current ? '<span class="badge bg-primary">Current</span>' : ''}</td>
                <td class="text-end">
                    ${Auth.hasPermission('auth.sessions.revoke') && !s.is_current ? `
                        <button class="btn btn-sm btn-outline-danger" onclick="revokeSession('${s.session_id}')">
                            <i class="bi bi-x-circle"></i> Revoke
                        </button>` : ''}
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
    }
}

async function revokeSession(sessionId) {
    if (!confirm('Revoke this session?')) return;
    try {
        await Api.delete(`/api/v1/sessions/${sessionId}`);
        Auth.showAlert('alert-container', 'Session revoked.', 'success');
        await loadSessions();
    } catch (err) {
        Auth.showAlert('alert-container', err.message, 'danger');
    }
}
</script>
{% endblock %}
