{% extends "base.html" %}
{% block title %}Roles - {{ app_name }}{% endblock %}
{% block page_title %}Role Management{% endblock %}

{% block content %}
<div class="card card-stat">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>System Role</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="roles-table-body">
                    <tr><td colspan="5" class="text-center py-4 text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await Auth.requireAuth();
    if (!Auth.hasPermission('auth.roles.view')) {
        Auth.showAlert('alert-container', 'You do not have permission to view roles.', 'warning');
        return;
    }
    try {
        const roles = await Api.get('/api/v1/roles/');
        const tbody = document.getElementById('roles-table-body');
        tbody.innerHTML = roles.map(r => `
            <tr>
                <td><code>${r.role_code}</code></td>
                <td>${r.role_name}</td>
                <td class="text-muted">${r.description || '—'}</td>
                <td>${r.is_system_role ? '<span class="badge bg-info">System</span>' : '—'}</td>
                <td>${r.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Inactive</span>'}</td>
            </tr>
        `).join('');
    } catch (err) {
        Auth.showAlert('alert-container', err.message, 'danger');
    }
});
</script>
{% endblock %}
